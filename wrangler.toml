name = "kaizenlife-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "KV"
id = ""

[[d1_databases]]
binding = "DB"
database_name = "kaizenlife-db"
database_id = ""

[build]
command = "bun install && bun run build"
watch_dir = "src"
