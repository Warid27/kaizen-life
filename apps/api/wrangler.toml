name = "kaizenlife-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8c9944621e329187d1e6bb37529be3e5"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "kaizenlife-db"
database_id = "3a564ea9-7aa6-4a27-8fb2-6fe55a15d52e"

[build]
command = "bun install"
watch_dir = "src"

# Push dispatcher: due reminders + ~08:00 local daily digests.
[triggers]
crons = ["*/15 * * * *"]