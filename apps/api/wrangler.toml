name = "kaizenlife-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "kaizenlife-db"
database_id = "" # Filled by deploy workflow (`wrangler d1 create`)

[build]
command = "bun install"
watch_dir = "src"