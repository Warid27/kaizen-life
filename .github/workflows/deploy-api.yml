name: Deploy API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create D1 database if not exists
        id: d1
        run: |
          RESULT=$(npx wrangler d1 create kaizenlife-db --config apps/api/wrangler.toml 2>&1) || true
          echo "$RESULT"
          DB_ID=$(echo "$RESULT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1)
          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure wrangler.toml with D1 binding
        run: |
          DB_ID="${{ steps.d1.outputs.database_id }}"
          echo "D1 Database ID: $DB_ID"
          if [ -n "$DB_ID" ]; then
            # Only overwrite when we REALLY created the DB. If it already
            # exists, d1 create fails and DB_ID is empty - keep the committed
            # database_id (apps/api/wrangler.toml) as-is.
            cat > apps/api/wrangler.toml << EOF
            name = "kaizenlife-api"
            main = "src/index.ts"
            compatibility_date = "2024-12-01"
            compatibility_flags = ["nodejs_compat"]

            [vars]
            ENVIRONMENT = "production"

            [[d1_databases]]
            binding = "DB"
            database_name = "kaizenlife-db"
            database_id = "$DB_ID"

            [build]
            command = "bun install"
            EOF
          else
            echo "Database already exists - keeping committed apps/api/wrangler.toml"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy